# Builds release archives when a v* tag is pushed.
# Pushing the tag creates the GitHub Release. Do not push a tag until you mean to publish.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
            minos: "10.12"
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
            minos: "11.0"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar
            deb: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar
            deb: arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Version matches the tag
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$tag" = "$cargo_version"
          echo "tag=$tag" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          set -eu
          if [ -n "${{ matrix.minos }}" ]; then
            export MACOSX_DEPLOYMENT_TARGET="${{ matrix.minos }}"
          fi
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: macOS deployment target
        if: matrix.minos
        run: ./packaging/check-macos-minos.sh "target/${{ matrix.target }}/release/rmbin" "${{ matrix.minos }}"
      - name: Link check
        shell: bash
        run: |
          set -eu
          ext=""
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            ext=".exe"
          fi
          ./packaging/check-linked-libs.sh "target/${{ matrix.target }}/release/rmbin${ext}"
      - name: Pack
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          name="rmbin-v${tag}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            tar -a -cf "dist/${name}.zip" -C "target/${{ matrix.target }}/release" rmbin.exe
          else
            tar -czf "dist/${name}.tar.gz" -C "target/${{ matrix.target }}/release" rmbin
          fi
          rustc --version > "dist/${name}.buildinfo"
      - name: Debian package
        if: matrix.deb
        shell: bash
        run: |
          set -eu
          python3 packaging/mkdeb.py \
            "target/${{ matrix.target }}/release/rmbin" \
            "$tag" \
            "${{ matrix.deb }}" \
            "dist/rmbin_${tag}-1_${{ matrix.deb }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Checksums and GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -eu
          cd dist
          # Hash the archives and packages, not the buildinfo notes.
          find . -maxdepth 1 -type f ! -name '*.buildinfo' -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          {
            echo "rmbin ${GITHUB_REF_NAME}"
            echo
            echo "Alpha. Overwrite is best effort on SSDs, APFS, snapshots, and backups."
            echo "The binaries are not signed. Verify with: sha256sum -c SHA256SUMS"
            echo
            cat ./*.buildinfo
          } > "$RUNNER_TEMP/NOTES.md"
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/NOTES.md
          fail_on_unmatched_files: true
