name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: Linux x86_64 musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: Linux aarch64 musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Format
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: No network crates or socket API
        shell: bash
        run: ./packaging/check-no-network.sh "${{ matrix.target }}"
      - name: No C toolchain crates
        shell: bash
        run: ./packaging/check-no-c.sh "${{ matrix.target }}"
      - name: Release binary links no TLS or HTTP library
        shell: bash
        run: |
          set -eu
          cargo build --release --locked --target "${{ matrix.target }}"
          ext=""
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            ext=".exe"
          fi
          ./packaging/check-linked-libs.sh "target/${{ matrix.target }}/release/rmbin${ext}"

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
